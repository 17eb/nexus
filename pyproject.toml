[project]
name = "nexus"
version = "0.1.0"
description = "Bored Pile Testing Management (BPTM)"
requires-python = ">=3.12"
dependencies = [
    "django>=5,<6",
    "psycopg[binary]>=3.1",
    "djangorestframework>=3.15",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
include = ["apps*", "nexus*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "factory_boy>=3.3",
    "import-linter>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
    "types-openpyxl>=3.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nexus.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps", "nexus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = "migrations/"

[tool.django-stubs]
django_settings_module = "nexus.settings.dev"

# Cross-module contract: each app in apps/ (identity, registry, testing,
# submittals, documents, tracking per CLAUDE.md's module layout) must
# only be reached from outside via its own services.py. `registry` and
# `documents` exist so far (docs/mvp-plan.md M0/M1) — import-linter needs
# a module to exist to reference it, so the full cross-app contract
# lands as the remaining four apps do. This contract covers what's
# buildable today: registry and documents may each still import the
# other's `services` module (that's the intended mechanism, not a gap —
# see registry.views.PackagePilesView and documents.services.request_upload),
# just never the other's models/admin/other internals directly.
[tool.importlinter]
root_package = "apps"

[[tool.importlinter.contracts]]
name = "registry.import_piles is internal to registry.services"
type = "forbidden"
source_modules = [
    "apps.registry.models",
    "apps.registry.admin",
]
forbidden_modules = [
    "apps.registry.import_piles",
]

[[tool.importlinter.contracts]]
name = "documents does not import registry internals"
type = "forbidden"
# allow_indirect_imports: documents.services legitimately calls
# registry.services (which itself imports registry.models internally) —
# only a DIRECT import of registry.models/admin from within documents is
# the actual violation this contract guards against.
allow_indirect_imports = true
source_modules = [
    "apps.documents",
]
forbidden_modules = [
    "apps.registry.models",
    "apps.registry.admin",
]

[[tool.importlinter.contracts]]
name = "registry does not import documents internals"
type = "forbidden"
# See the sibling contract above — registry.views legitimately calls
# documents.services (which imports documents.models internally).
allow_indirect_imports = true
source_modules = [
    "apps.registry",
]
forbidden_modules = [
    "apps.documents.models",
    "apps.documents.admin",
]
